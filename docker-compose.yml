# Local development services for the Waypad API.
#   docker compose up -d      start PostgreSQL and Redis
#   docker compose down       stop them (data is kept in named volumes)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: waypad
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  redis:
    # background jobs (BullMQ): booking import, daily purge
    image: redis:7-alpine
    ports:
      - '6379:6379'

  # The API itself, built from apps/api/Dockerfile. Only started with:
  #   docker compose --profile full up --build
  api:
    profiles: ['full']
    build: ./apps/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/waypad
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-docker-secret-that-is-long-enough-1234567890
      SEED_DEMO: 'true'
    ports:
      - '3000:3000'
    volumes:
      - storage:/data/storage

volumes:
  pgdata:
  storage:
