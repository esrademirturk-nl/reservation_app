# Local development services for the Waypad API.
#   docker compose up -d      start PostgreSQL and Redis
#   docker compose down       stop them (data is kept in named volumes)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: waypad
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  redis:
    # used from milestone 4 for background jobs (BullMQ)
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  pgdata:
