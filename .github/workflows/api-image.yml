name: API image

# Builds the API Docker image on every pull request (to catch Dockerfile errors)
# and publishes it to GitHub Container Registry when main changes.
on:
  pull_request:
    paths: ['apps/api/**', '.github/workflows/api-image.yml']
  push:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/api-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/waypad-api
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          load: true
          tags: |
            waypad-api:smoke
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        # the container must start, run migrations, load the demo and answer the health check
        run: |
          docker network create waypad
          docker run -d --name db --network waypad -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=waypad postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run -d --name api --network waypad -p 3000:3000 \
            -e DATABASE_URL=postgresql://postgres:postgres@db:5432/waypad \
            -e JWT_SECRET=smoke-test-secret-that-is-long-enough-123456 \
            -e SEED_DEMO=true waypad-api:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/v1/health; then
              curl -fsS -X POST http://localhost:3000/api/v1/auth/login -H 'content-type: application/json' \
                -d '{"email":"esra@demo.waypad.app","password":"waypad-demo1"}' > /dev/null && exit 0
            fi
            sleep 2
          done
          docker logs api; exit 1
      - name: Push
        if: github.event_name != 'pull_request'
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -n1 docker push
