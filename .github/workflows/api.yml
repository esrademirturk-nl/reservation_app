name: API checks

on:
  pull_request:
    paths: ['apps/api/**', '.github/workflows/api.yml']
  push:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/api.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waypad_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/waypad_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations match the schema
        # generating again must produce no new migration
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate --name schema-drift-check
          git diff --exit-code --stat -- drizzle && test -z "$(git ls-files --others --exclude-standard drizzle)"
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
