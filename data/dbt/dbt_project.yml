name: waypad
version: '1.0.0'
config-version: 2
profile: waypad

model-paths: ['models']
macro-paths: ['macros']
target-path: target
clean-targets: ['target', 'dbt_packages']

models:
  waypad:
    staging:
      +materialized: view
      +schema: staging
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
